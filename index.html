<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikaela's Portfolio</title>

  <!-- Cubic 11 pixel font (applied to the bio text via --bio-font in styles.css) -->
  <link rel="preconnect" href="https://cn-font.claude-code-best.win" crossorigin />
  <link rel="stylesheet" href="https://cn-font.claude-code-best.win/packages/cubic/dist/Cubic/result.css" />

  <!-- Font Awesome (free) — enables the <i class="fa-..."> contact icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================================= -->
  <!-- FIXED BACKGROUND IMAGE                        -->
  <!-- Stays put behind everything, never scrolls.   -->
  <!-- Set the image in styles.css: --bg-image       -->
  <!-- ============================================= -->
  <div class="bg" aria-hidden="true"></div>

  <!-- ============================================= -->
  <!-- INTRO ANIMATION SCREEN                        -->
  <!-- ============================================= -->
  <div id="intro" class="intro">
    <!-- ADD/CHANGE INTRO TEXT HERE -->
    <h1 class="intro__text">欢迎来到Mikaela的秘密基地</h1>
  </div>

  <!-- ============================================= -->
  <!-- MAIN PAGE                                     -->
  <!-- ============================================= -->
  <div id="main" class="main" aria-hidden="true">

    <!-- ===== CENTERED TOP NAV ===== -->
    <nav class="nav">
      <button class="nav__tab is-active" type="button" data-target="home">首页</button>
      <span class="nav__sep">|</span>
      <button class="nav__tab" type="button" data-target="works">作品</button>
      <span class="nav__sep">|</span>
      <button class="nav__tab" type="button" data-target="art">艺术</button>
      <span class="nav__sep">|</span>
      <button class="nav__tab" type="button" data-target="contact">联系我</button>
    </nav>

    <!-- ===== SLIDING SECTIONS ===== -->
    <div class="sections">

      <!-- ---------- 首页 / HOME ---------- -->
      <!-- Home is a vertically scrollable page; stack more .home-block's below. -->
      <section class="section is-active" data-section="home">

        <!-- ===== BLOCK 1: About me (≈ full screen) ===== -->
        <!-- This block has its OWN background that scrolls with the page. -->
        <div class="home-block home-block--about">

          <!-- Decorative ball with TWO slow motions:
               • wrapper ORBITS (revolves) around the anchor point
               • image SELF-ROTATES on its own axis
               Tune: --ball-top / --ball-left = anchor point,
                     --orbit-radius = how wide the orbit circle is,
                     --ball-size = ball diameter. -->
          <div class="ball-orbit"
               style="--ball-top: 33%; --ball-left: 35%; --orbit-radius: 80px;">
            <img src="Page_pic/small_ball.png"
                 class="ball-core"
                 style="--ball-size: 520px;"
                 alt="" aria-hidden="true" />
          </div>

          <div class="home-block__content about">
            <h2>关于我</h2>

            <!-- Row under the heading: profile picture (left) + bio (right) -->
            <div class="about__row">

              <!-- REPLACE / RESIZE YOUR PROFILE PICTURE HERE.
                   Adjust size via --pfp-size (or just edit the img). -->
              <img src="Page_pic/my_pfp_avatar.png"
                   class="about__pfp"
                   style="--pfp-size: 150px;"
                   alt="Mikaela 的头像" />

              <div class="about__bio">
                <!-- ADD YOUR BIO / 个人简介 HERE (left-aligned) -->
                <h1>Mikaela. Duan</h1>
                <p>计算机科学毕业生</p>
                <p>数据分析 | 全栈开发 | 视觉设计 | 赛博观测者 | 偶尔的艺术家</p>
                <p>欢迎来到我的小宇宙 🌌 这里住着一个写代码的、做数据分析的、偶尔画画的计算机毕业生。喜欢钻研、喜欢学新东西,也喜欢把想法变成看得见的作品。</p>
              </div>

            </div>
          </div>
        </div>

        <!-- ===== BLOCK 2: Resume (简历) ===== -->
        <div class="home-block home-block--resume">
          <div class="home-block__content resume">
            <h2>简历</h2>

            <!-- ADD SKILLS HERE (white text, no border for now) -->
            <div class="resume__text">
              <h3>技能</h3>
              <p>Placeholder — 在这里添加你的技能。</p>
            </div>
          </div>
        </div>

        <!-- ADD MORE HOME BLOCKS BELOW (copy a .home-block above) -->

      </section>

      <!-- ---------- 作品 / WORKS ---------- -->
      <section class="section" data-section="works">
        <div class="section__inner">
          <!-- ADD WORKS HERE (each project = one .circle) -->
          <div class="circle" style="--circle-size: 180px;"><span>作品 1</span></div>
          <div class="circle" style="--circle-size: 180px;"><span>作品 2</span></div>
          <div class="circle" style="--circle-size: 180px;"><span>作品 3</span></div>
        </div>
      </section>

      <!-- ---------- 艺术 / ART ---------- -->
      <section class="section" data-section="art">
        <div class="section__inner">
          <!-- ADD ART PIECES HERE -->
          <div class="circle" style="--circle-size: 200px;"><span>艺术 1</span></div>
          <div class="circle" style="--circle-size: 140px;"><span>艺术 2</span></div>
          <div class="circle" style="--circle-size: 170px;"><span>艺术 3</span></div>
        </div>
      </section>

      <!-- ---------- 联系我 / CONTACT ---------- -->
      <section class="section" data-section="contact">
        <div class="section__inner contact">

          <!-- Email: click to reveal two addresses; click an address to copy it -->
          <!-- (fa-light is Pro-only; using free fa-solid fa-envelope) -->
          <div class="contact-btn contact-btn--email" role="button" tabindex="0" aria-label="Email">
            <i class="contact-btn__icon fa-solid fa-envelope" aria-hidden="true"></i>
            <div class="contact-emails">
              <!-- REPLACE with your real emails -->
              <button class="contact-email" type="button" data-email="mikaeladyj@outlook.com">mikaeladyj@outlook.com</button>
              <button class="contact-email" type="button" data-email="lilinjojoko@gmail.com">lilinjojoko@gmail.com</button>
            </div>
          </div>

          <!-- GitHub: paste your profile URL into href -->
          <a class="contact-btn" href="https://github.com/Mikaela-Cycho" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="contact-btn__icon fa-brands fa-github" aria-hidden="true"></i>
          </a>

          <!-- LinkedIn: paste your profile URL into href -->
          <a class="contact-btn" href="https://www.linkedin.com/in/mikaela-duan-4879812a9/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="contact-btn__icon fa-brands fa-linkedin" aria-hidden="true"></i>
          </a>

          <!-- Extra placeholder buttons — fill in or delete to keep just 3 -->
          <a class="contact-btn" href="placeholder" target="_blank" rel="noopener noreferrer">
            <span class="contact-btn__label">占位 4</span>
          </a>
          <a class="contact-btn" href="placeholder" target="_blank" rel="noopener noreferrer">
            <span class="contact-btn__label">占位 5</span>
          </a>

        </div>
      </section>

    </div>
  </div>

  <!-- Animated click cursor (APNG). Driven by script.js; shown only while
       hovering clickable elements. Swap the src to change the animation. -->
  <img id="anim-cursor" class="anim-cursor"
       src="Page_pic/cursor_click_animation_sm.png"
       alt="" aria-hidden="true" />

  <script src="script.js"></script>
</body>
</html>
